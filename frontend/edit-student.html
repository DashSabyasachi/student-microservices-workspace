<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student - Student Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="card auth-card" style="max-width:520px; margin-top:30px;">
        <h2>Edit Student</h2>
        <div id="msg" class="message"></div>

        <form id="studentForm">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" readonly>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="1" max="120" required>

            <label for="course">Course</label>
            <input type="text" id="course" required>

            <label for="phoneNumber">Phone Number (10 digits)</label>
            <input type="text" id="phoneNumber" pattern="\d{10}" maxlength="10" required>

            <button type="submit" class="btn-full">Update Student</button>
        </form>
        <p class="link-text"><a href="dashboard.html">&larr; Back to dashboard</a></p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/edit-student.js"></script>
</body>
</html>
